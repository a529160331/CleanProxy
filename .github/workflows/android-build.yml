name: Android Debug APK

on:
  push:
    branches: [ main, master, feature/free-client-foundation ]
  workflow_dispatch:

concurrency:
  group: cleanproxy-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build both debug APKs
        run: gradle :app:assembleDebug :wifiapp:assembleDebug --stacktrace
      - name: Upload CleanProxy APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanProxy-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload CleanWiFi APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanWiFi-debug
          path: wifiapp/build/outputs/apk/debug/wifiapp-debug.apk
